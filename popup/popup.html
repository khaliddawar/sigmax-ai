<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignalScope</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>SignalScope</h1>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <main>
      <section class="quick-stats">
        <div class="stat-card">
          <div class="stat-value" id="messagesCapture">0</div>
          <div class="stat-label">Messages Captured</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="queueSize">0</div>
          <div class="stat-label">In Queue</div>
        </div>
      </section>

      <section class="platform-info">
        <div class="info-row">
          <span class="info-label">Platform:</span>
          <span class="info-value" id="currentPlatform">Not detected</span>
        </div>
        <div class="info-row">
          <span class="info-label">Webhook:</span>
          <span class="info-value" id="webhookStatus">Not configured</span>
        </div>
      </section>

      <section class="actions">
        <button id="toggleCapture" class="btn btn-primary">
          <span class="btn-icon">⏸</span>
          Pause Capture
        </button>
        <button id="testWebhook" class="btn btn-secondary">
          <span class="btn-icon">🔔</span>
          Test Webhook
        </button>
        <button id="clearQueue" class="btn btn-secondary">
          <span class="btn-icon">🗑</span>
          Clear Queue
        </button>
      </section>
    </main>

    <footer>
      <button id="openOptions" class="btn-link">Settings</button>
      <span class="separator">•</span>
      <button id="openHelp" class="btn-link">Help</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
