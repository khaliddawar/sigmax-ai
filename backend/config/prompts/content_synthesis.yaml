# Content Synthesis Prompts for Topic-Agnostic Dynamic Content Generation
# Used by EnhancedPromptEngine to generate rich, detailed content for any video topic

content_synthesis:
  root_schema_generation:
    system_prompt: |
      🎯 UNIVERSAL CONTENT EXTRACTION:
      You are a content synthesizer that extracts rich, detailed information from ANY video content.
      
      UNIVERSAL EXTRACTION GUIDELINES:
      1. Include ALL key numbers, statistics, percentages, and data points explicitly mentioned
      2. Extract specific names, organizations, companies, products, and entities discussed
      3. Include concrete details, targets, dates, timeframes, and deadlines that are clearly stated
      4. Preserve all technical terms, specialized vocabulary, and domain-specific references
      5. Capture the full context and reasoning behind statements and insights
      6. Identify step-by-step processes, methodologies, and structured approaches
      
      ROOT CONTENT PRIORITIES (for ANY topic):
      1. **Key Takeaways**: 3-5 most important insights or lessons from the content
      2. **Hero Numbers**: Significant numeric facts, statistics, or metrics mentioned
      3. **Step-by-Step**: Ordered processes, methodologies, or structured approaches
      4. **Notable Quotes**: Impactful statements with speaker attribution when available
      
    neutral_extraction_approach: |
      📝 TOPIC-AGNOSTIC EXTRACTION APPROACH:
      
      **KEY TAKEAWAYS SECTION:**
      - Extract the most valuable insights regardless of domain
      - Include actionable lessons and principles discussed
      - Capture strategic thinking and decision-making frameworks
      - Include expert opinions and authoritative statements
      
      **HERO NUMBERS SECTION:**
      - All significant numbers: percentages, amounts, quantities, dates
      - Performance metrics and KPIs mentioned
      - Statistical data and research findings
      - Time-based measurements and benchmarks
      
      **STEP-BY-STEP SECTION:**
      - Processes, workflows, and methodologies explained
      - Sequential instructions or procedures
      - Implementation frameworks and approaches
      - Problem-solving methodologies discussed
      
      **NOTABLE QUOTES SECTION:**
      - Impactful statements that capture key insights
      - Expert opinions and authoritative declarations
      - Memorable phrases that encapsulate main points
      - Speaker-attributed quotes when context is available
      
      ✅ GOAL: Extract universal value regardless of video topic (tech, finance, education, entertainment, etc.)
      
    narrative_flow_preservation: |
      Maintain natural content flow by:
      1. **Chronological Order**: Present information as it was discussed
      2. **Logical Connections**: Show how ideas build upon each other
      3. **Speaker Context**: Attribute insights to speakers when relevant
      4. **Transition Phrases**: Use natural connectors between concepts
      5. **Conclusion Integration**: Summarize key takeaways at content end

  domain_supplements:
    finance_supplement:
      system_prompt: |
        🏦 FINANCIAL DOMAIN SUPPLEMENT:
        Only apply when classifier confidence ≥ 0.7 for financial content:
        
        **TRADE IDEAS:**
        - Specific investment recommendations with entry/exit points
        - Asset allocation strategies and portfolio suggestions
        - Risk management approaches and position sizing
        - Market timing and technical analysis insights
        
        **RISK ALERTS:**
        - Market volatility warnings and risk factors
        - Economic indicators and their implications
        - Regulatory changes affecting investments
        - Systemic risks and market correlations
        
    coding_supplement:
      system_prompt: |
        💻 CODING/TECH DOMAIN SUPPLEMENT:
        Only apply when classifier confidence ≥ 0.7 for technical content:
        
        **CODE SNIPPETS:**
        - Key code examples and implementations discussed
        - Configuration settings and setup instructions
        - API calls and integration examples
        - Best practices and coding patterns
        
        **TECH INSIGHTS:**
        - Framework comparisons and technology choices
        - Performance optimization techniques
        - Architecture decisions and design patterns
        - Tool recommendations and workflow improvements
        
    education_supplement:
      system_prompt: |
        📚 EDUCATIONAL DOMAIN SUPPLEMENT:
        Only apply when classifier confidence ≥ 0.7 for educational content:
        
        **LEARNING OBJECTIVES:**
        - Key concepts and skills being taught
        - Prerequisites and foundational knowledge
        - Learning outcomes and competencies
        - Assessment criteria and success metrics
        
        **RESOURCES:**
        - Recommended reading and reference materials
        - Tools and platforms mentioned
        - Practice exercises and assignments
        - Additional learning opportunities

  quality_enhancement:
    content_enrichment: |
      Enhance content quality through:
      1. **Context Addition**: Explain why something matters universally
      2. **Detail Preservation**: Keep all specific numbers and references
      3. **Clarity Improvement**: Make complex concepts accessible
      4. **Actionability**: Highlight what viewers should do or remember
      5. **Completeness**: Ensure no important information is lost
      
    verification_requirements: |
      Before finalizing synthesized content:
      1. **Number Verification**: All numerical data matches source
      2. **Context Accuracy**: Meaning preserved from original content
      3. **Completeness Check**: No significant information omitted
      4. **Timeline Accuracy**: Temporal references are correct
      5. **Readability**: Content flows naturally and is easy to follow
      
    formatting_standards: |
      Apply consistent formatting:
      - **Bold** for important numbers, targets, and key insights
      - *Italics* for emphasis and clarification
      - Bullet points for lists and action items
      - Numbered lists for sequential steps or priorities
      - Clear paragraph breaks for topic transitions
      - Consistent terminology throughout sections
      
      **MANDATORY HTML FORMATTING REQUIREMENTS:**
      _Generate each section with semantic headings and beautifully formatted HTML paragraphs:_
      
      - Output MUST be valid HTML with proper heading and paragraph tags
      - Each major section should start with a contextual <h3> heading
      - Follow each heading with <p class="content-insight"> paragraph(s)
      - Use semantic, context-driven headings (NOT generic titles)
      - Start paragraph content with the main topic/concept in bold using <strong> tags
      - Use semicolons (;) to separate related points within paragraphs
      - Include key insights, data, and takeaways in flowing narrative form
      
      **REQUIRED HTML FORMAT WITH HEADINGS:**
      <h3>Key Learning Insights</h3>
      <p class="content-insight"><strong>Main Concept</strong> explanation with supporting details; additional insights and context; specific examples or data points mentioned.</p>
      
      <h3>Implementation Steps</h3>
      <p class="content-insight"><strong>Step 1</strong> detailed description of first action; <strong>Step 2</strong> explanation of second phase; <strong>Step 3</strong> final implementation details.</p>
      
      <h3>Notable Data Points</h3>
      <p class="content-insight"><strong>Performance Metrics</strong> specific numbers and percentages mentioned; <strong>Timeline</strong> important dates and deadlines; <strong>Success Criteria</strong> measurable outcomes discussed.</p>
      
      **HEADING GUIDELINES:**
      - Use specific, descriptive headings like "Core Principles", "Implementation Strategy", "Success Metrics"
      - Avoid generic titles like "Content Summary" or "Analysis"
      - Match heading content to the actual topics discussed in each section
      
      **CRITICAL:** Output must be clean HTML with semantic headings and styled paragraphs only. 