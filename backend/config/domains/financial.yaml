# Chunking parameters for financial content
chunking:
  paragraph_split: true
  max_chunk_size: 4000
  overlap: 100
  preserve_sentences: true

# Validation rules
validation:
  required_sections:
    - "indices"
    - "trading"
  min_content_length: 50
  max_empty_buckets: 1 